name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Build with sanitizers
        run: make sanitize

      - name: Smoke test sanitized binary
        run: ./bin/novash -c "printf hello | tr a-z A-Z"
